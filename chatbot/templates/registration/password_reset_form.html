{% extends 'registration/base.html' %}
{% block title %}Password Reset{% endblock %}
{% block content %}
<h2>Reset Password</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send Reset Email</button>
</form>
<p><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
